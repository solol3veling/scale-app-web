version: '3.8'

services:
  # Development service
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-}
      - VITE_CLOUDINARY_API_URL=${VITE_CLOUDINARY_API_URL:-https://api.cloudinary.com/v1_1}
      - VITE_BACKEND_BASE_URL=${VITE_BACKEND_BASE_URL:-http://localhost:8000}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_SUPABASE_AUTH_TOKEN_KEY=${VITE_SUPABASE_AUTH_TOKEN_KEY:-}
      - VITE_APP_URL=${VITE_APP_URL}
      - VITE_S3_ENDPOINT=${VITE_S3_ENDPOINT:-http://localhost:9000}
      - VITE_S3_REGION=${VITE_S3_REGION:-us-east-1}
      - VITE_S3_ACCESS_KEY_ID=${VITE_S3_ACCESS_KEY_ID:-minioadmin}
      - VITE_S3_SECRET_ACCESS_KEY=${VITE_S3_SECRET_ACCESS_KEY:-minioadmin}
      - VITE_S3_BUCKET_NAME=${VITE_S3_BUCKET_NAME:-scale-app}
      - VITE_S3_FORCE_PATH_STYLE=${VITE_S3_FORCE_PATH_STYLE:-true}
      - VITE_S3_USE_SSL=${VITE_S3_USE_SSL:-false}
      - VITE_S3_PORT=${VITE_S3_PORT:-9000}
    command: sh -c "npm ci && npm run dev -- --host"
    profiles: ["dev"]

  # Production service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
        - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-}
        - VITE_CLOUDINARY_API_URL=${VITE_CLOUDINARY_API_URL:-https://api.cloudinary.com/v1_1}
        - VITE_BACKEND_BASE_URL=${VITE_BACKEND_BASE_URL:-http://localhost:8000}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_SUPABASE_AUTH_TOKEN_KEY=${VITE_SUPABASE_AUTH_TOKEN_KEY:-}
        - VITE_APP_URL=${VITE_APP_URL}
        - VITE_S3_ENDPOINT=${VITE_S3_ENDPOINT:-http://localhost:9000}
        - VITE_S3_REGION=${VITE_S3_REGION:-us-east-1}
        - VITE_S3_ACCESS_KEY_ID=${VITE_S3_ACCESS_KEY_ID:-minioadmin}
        - VITE_S3_SECRET_ACCESS_KEY=${VITE_S3_SECRET_ACCESS_KEY:-minioadmin}
        - VITE_S3_BUCKET_NAME=${VITE_S3_BUCKET_NAME:-scale-app}
        - VITE_S3_FORCE_PATH_STYLE=${VITE_S3_FORCE_PATH_STYLE:-true}
        - VITE_S3_USE_SSL=${VITE_S3_USE_SSL:-false}
        - VITE_S3_PORT=${VITE_S3_PORT:-9000}
    ports:
      - "3000:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["prod"]
