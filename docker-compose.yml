version: '3.8'

services:
  # Development service
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-}
      - VITE_CLOUDINARY_API_URL=${VITE_CLOUDINARY_API_URL:-https://api.cloudinary.com/v1_1}
      - VITE_BACKEND_BASE_URL=${VITE_BACKEND_BASE_URL:-http://localhost:8000}
      - VITE_SUPABASE_AUTH_TOKEN_KEY=${VITE_SUPABASE_AUTH_TOKEN_KEY:-}
    command: sh -c "npm ci && npm run dev -- --host"
    profiles: ["dev"]

  # Production service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
        - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-}
        - VITE_CLOUDINARY_API_URL=${VITE_CLOUDINARY_API_URL:-https://api.cloudinary.com/v1_1}
        - VITE_BACKEND_BASE_URL=${VITE_BACKEND_BASE_URL:-http://localhost:8000}
        - VITE_SUPABASE_AUTH_TOKEN_KEY=${VITE_SUPABASE_AUTH_TOKEN_KEY:-}
    ports:
      - "3000:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["prod"]
