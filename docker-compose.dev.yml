version: '3.8'

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-}
      - VITE_CLOUDINARY_API_URL=${VITE_CLOUDINARY_API_URL:-https://api.cloudinary.com/v1_1}
      - VITE_BACKEND_BASE_URL=${VITE_BACKEND_BASE_URL:-http://localhost:8000}
      - VITE_SUPABASE_AUTH_TOKEN_KEY=${VITE_SUPABASE_AUTH_TOKEN_KEY:-}
    restart: unless-stopped
    networks:
      - app-network
    command: npm run dev -- --host

networks:
  app-network:
    driver: bridge
