name: Production Deployment Pipeline

on:
  push:
    branches: [ dev, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile.prod
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/project:scalestash.io.web.latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VITE_API_BASE_URL=http://scalestash-api
          VITE_CLOUDINARY_CLOUD_NAME=dnuyuq1sd
          VITE_CLOUDINARY_API_URL=https://api.cloudinary.com/v1_1
          VITE_BACKEND_BASE_URL=http://scalestash-api
          VITE_SUPABASE_URL=https://bhdbjtlzfoyzslhzkplu.supabase.co
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_AUTH_TOKEN_KEY=sb-bhdbjtlzfoyzslhzkplu-auth-token
          VITE_APP_URL=https://app.scalestash.com
          VITE_S3_ENDPOINT=http://95.217.221.17:9000
          VITE_S3_REGION=us-east-1
          VITE_S3_ACCESS_KEY_ID=${{ secrets.VITE_S3_ACCESS_KEY_ID }}
          VITE_S3_SECRET_ACCESS_KEY=${{ secrets.VITE_S3_SECRET_ACCESS_KEY }}
          VITE_S3_BUCKET_NAME=scale-app
          VITE_S3_FORCE_PATH_STYLE=true
          VITE_S3_USE_SSL=false
          VITE_S3_PORT=9000

    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # Login to DockerHub
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # Pull latest image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/project:scalestash.io.web.latest

          # Stop and remove existing container
          docker stop scalestash-web || true
          docker rm scalestash-web || true

          # Run new container
          docker run -d \
            --name scalestash-web \
            --network traefik_network \
            -p 5173:80 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/project:scalestash.io.web.latest

          # Clean up dangling images and stopped containers
          docker image prune -af --filter "until=24h"
          docker container prune -f

          # Verify deployment
          docker ps | grep scalestash-web
          echo "✅ Deployment completed successfully"
