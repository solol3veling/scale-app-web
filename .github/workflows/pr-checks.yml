name: 🔍 Pull Request Checks

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'

jobs:
  # Basic quality checks for PRs
  quality-checks:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🧪 Run tests
        run: |
          if npm run | grep -q "test"; then
            npm run test -- --watchAll=false
          else
            echo "No tests found - consider adding tests for better coverage"
          fi
        continue-on-error: true

      - name: 🏗️ Test build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://staging-api.yourapp.com
          VITE_CLOUDINARY_CLOUD_NAME: test_cloud
          VITE_CLOUDINARY_API_URL: https://api.cloudinary.com/v1_1
          VITE_BACKEND_BASE_URL: https://staging-api.yourapp.com
          VITE_SUPABASE_AUTH_TOKEN_KEY: test_token

  # Security and dependency checks
  security-checks:
    name: 🛡️ Security
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔒 Run security audit
        run: npm audit --audit-level moderate
        continue-on-error: true

      - name: 🔍 Check for hardcoded secrets
        run: |
          # Simple check for common secret patterns
          if grep -r -E "(password|secret|key|token)\s*=\s*['\"][^'\"]{10,}" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
            echo "⚠️ Potential hardcoded secrets found!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi

  # Docker build test
  docker-build-test:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Test Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=https://staging-api.yourapp.com
            VITE_CLOUDINARY_CLOUD_NAME=test_cloud
            VITE_CLOUDINARY_API_URL=https://api.cloudinary.com/v1_1
            VITE_BACKEND_BASE_URL=https://staging-api.yourapp.com
            VITE_SUPABASE_AUTH_TOKEN_KEY=test_token

  # Comment on PR with results
  pr-comment:
    name: 💬 PR Comment
    runs-on: ubuntu-latest
    needs: [quality-checks, security-checks, docker-build-test]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: 💬 Comment PR results
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              quality: '${{ needs.quality-checks.result }}',
              security: '${{ needs.security-checks.result }}',
              docker: '${{ needs.docker-build-test.result }}'
            };
            
            const getEmoji = (result) => {
              switch(result) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏸️';
                default: return '⚠️';
              }
            };
            
            const body = `## 🔍 PR Check Results
            
            | Check | Status | Result |
            |-------|--------|--------|
            | Code Quality | ${getEmoji(results.quality)} | ${results.quality} |
            | Security | ${getEmoji(results.security)} | ${results.security} |
            | Docker Build | ${getEmoji(results.docker)} | ${results.docker} |
            
            ${results.quality === 'success' && results.security === 'success' && results.docker === 'success' 
              ? '🎉 All checks passed! Ready for review.' 
              : '⚠️ Some checks failed. Please review and fix issues before merging.'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });