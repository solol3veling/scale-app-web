name: 🚀 Production Build & Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # Enhanced Quality & Security Checks for Production
  quality-checks:
    name: 🔍 Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔍 Run ESLint with error reporting
        run: |
          npm run lint -- --format=json --output-file=eslint-report.json
          npm run lint
        continue-on-error: false

      - name: 🧪 Run comprehensive tests
        run: |
          if npm run | grep -q "test"; then
            npm run test -- --coverage --watchAll=false
          else
            echo "⚠️ No test script found - tests are required for production!"
            exit 1
          fi

      - name: 🔒 Security audit (strict)
        run: npm audit --audit-level low

      - name: 📊 Build size analysis
        run: |
          npm run build
          echo "📊 Build Analysis:"
          du -sh dist/
          find dist/ -name "*.js" -exec du -sh {} \; | sort -hr | head -10
        env:
          VITE_API_BASE_URL: https://api.yourapp.com
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_API_URL: https://api.cloudinary.com/v1_1
          VITE_BACKEND_BASE_URL: https://api.yourapp.com
          VITE_SUPABASE_AUTH_TOKEN_KEY: ${{ secrets.VITE_SUPABASE_AUTH_TOKEN_KEY }}

      - name: 📋 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            eslint-report.json

  # Build Production Docker Image
  build-production:
    name: 🐳 Build Production Image
    runs-on: ubuntu-latest
    needs: quality-checks
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Generate version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION=${{ github.event.release.tag_name }}
          else
            VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::8}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_BASE_URL=https://api.yourapp.com
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_API_URL=https://api.cloudinary.com/v1_1
            VITE_BACKEND_BASE_URL=https://api.yourapp.com
            VITE_SUPABASE_AUTH_TOKEN_KEY=${{ secrets.VITE_SUPABASE_AUTH_TOKEN_KEY }}

      - name: 🔏 Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Comprehensive Security Scanning
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: build-production
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-production.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: 📊 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🔒 Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-production.outputs.image-tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # Production Deployment (Manual Approval Required)
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-production, security-scan]
    environment: 
      name: production
      url: https://yourapp.com
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Image: ${{ needs.build-production.outputs.image-tag }}"
          echo "Version: ${{ needs.build-production.outputs.version }}"
          echo "Digest: ${{ needs.build-production.outputs.image-digest }}"
          
          # Production deployment logic here
          # Examples:
          
          # Docker Compose deployment:
          # ssh production-server "cd /app && docker-compose pull && docker-compose up -d"
          
          # Kubernetes deployment:
          # kubectl set image deployment/frontend frontend=${{ needs.build-production.outputs.image-tag }}
          # kubectl rollout status deployment/frontend
          
          # AWS ECS deployment:
          # aws ecs update-service --cluster production --service frontend --force-new-deployment
          
          # Terraform/IaC deployment:
          # terraform plan -var="image_tag=${{ needs.build-production.outputs.version }}"
          # terraform apply -auto-approve
          
          echo "✅ Production deployment completed"

      - name: 🧪 Run production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          # Add comprehensive smoke tests
          # curl -f https://yourapp.com/health || exit 1
          # curl -f https://yourapp.com/api/health || exit 1
          echo "✅ Production smoke tests passed"

      - name: 📊 Performance testing
        run: |
          echo "📊 Running performance tests..."
          # Add lighthouse CI or other performance tests
          # npx lighthouse-ci autorun
          echo "✅ Performance tests completed"

  # Rollback capability
  rollback:
    name: 🔄 Rollback (Manual)
    runs-on: ubuntu-latest
    environment: production-rollback
    if: failure() && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: [deploy-production]
    steps:
      - name: 🔄 Rollback deployment
        run: |
          echo "🔄 Rolling back production deployment..."
          # Add rollback logic here
          # kubectl rollout undo deployment/frontend
          echo "✅ Rollback completed"

  # Release Management
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build-production.outputs.version }}
          release_name: Release ${{ needs.build-production.outputs.version }}
          body: |
            ## 🚀 Production Release ${{ needs.build-production.outputs.version }}
            
            **Docker Image:** `${{ needs.build-production.outputs.image-tag }}`
            **Image Digest:** `${{ needs.build-production.outputs.image-digest }}`
            
            ### 📋 Changes
            ${{ github.event.head_commit.message }}
            
            ### 🔗 Links
            - [Live Application](https://yourapp.com)
            - [Health Check](https://yourapp.com/health)
            - [Docker Image](https://github.com/${{ github.repository }}/pkgs/container/frontend)
          draft: false
          prerelease: false

  # Notifications
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, release]
    if: always()
    steps:
      - name: 📢 Notify on success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "✅ Production deployment successful!"
          echo "🌐 Application is live at: https://yourapp.com"
          # Add success notifications (Slack, Discord, Teams, etc.)

      - name: 📢 Notify on failure
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          # Add failure notifications with escalation