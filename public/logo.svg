<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="50" cy="50" r="45" fill="url(#mainGradient)" />
  
  <!-- Central hub -->
  <circle cx="50" cy="50" r="8" fill="white" />
  
  <!-- Platform nodes -->
  <!-- Top platform -->
  <circle cx="50" cy="25" r="6" fill="url(#accentGradient)" />
  <!-- Top right -->
  <circle cx="68" cy="32" r="6" fill="url(#accentGradient)" />
  <!-- Right -->
  <circle cx="75" cy="50" r="6" fill="url(#accentGradient)" />
  <!-- Bottom right -->
  <circle cx="68" cy="68" r="6" fill="url(#accentGradient)" />
  <!-- Bottom -->
  <circle cx="50" cy="75" r="6" fill="url(#accentGradient)" />
  <!-- Bottom left -->
  <circle cx="32" cy="68" r="6" fill="url(#accentGradient)" />
  <!-- Left -->
  <circle cx="25" cy="50" r="6" fill="url(#accentGradient)" />
  <!-- Top left -->
  <circle cx="32" cy="32" r="6" fill="url(#accentGradient)" />
  
  <!-- Connection lines -->
  <line x1="50" y1="42" x2="50" y2="31" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="42" x2="62" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="50" x2="69" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="58" x2="62" y2="62" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="58" x2="50" y2="69" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="58" x2="38" y2="62" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="50" x2="31" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="42" x2="38" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" />
  
  <!-- Content flow indicators -->
  <!-- Small dots representing content -->
  <circle cx="50" cy="35" r="1.5" fill="white" opacity="0.8" />
  <circle cx="60" cy="40" r="1.5" fill="white" opacity="0.8" />
  <circle cx="65" cy="50" r="1.5" fill="white" opacity="0.8" />
  <circle cx="60" cy="60" r="1.5" fill="white" opacity="0.8" />
  <circle cx="50" cy="65" r="1.5" fill="white" opacity="0.8" />
  <circle cx="40" cy="60" r="1.5" fill="white" opacity="0.8" />
  <circle cx="35" cy="50" r="1.5" fill="white" opacity="0.8" />
  <circle cx="40" cy="40" r="1.5" fill="white" opacity="0.8" />
</svg>