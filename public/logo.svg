<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Stack Layer 1 (Bottom) -->
  <rect x="15" y="45" width="70" height="40" rx="8" ry="8" 
        fill="url(#layer1)" 
        filter="url(#dropShadow)"
        opacity="0.8"/>
  
  <!-- Stack Layer 2 (Middle) -->
  <rect x="15" y="35" width="70" height="40" rx="8" ry="8" 
        fill="url(#layer2)" 
        filter="url(#dropShadow)"
        opacity="0.9"/>
  
  <!-- Stack Layer 3 (Top) -->
  <rect x="15" y="25" width="70" height="40" rx="8" ry="8" 
        fill="url(#layer3)" 
        filter="url(#dropShadow)"/>
  
  <!-- Stack indicator lines (showing it's a stack) -->
  <rect x="20" y="30" width="60" height="1" rx="0.5" fill="white" opacity="0.3"/>
  <rect x="20" y="32" width="60" height="1" rx="0.5" fill="white" opacity="0.2"/>
  
  <!-- Content placeholder lines on top layer -->
  <rect x="22" y="35" width="20" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="22" y="39" width="15" height="2" rx="1" fill="white" opacity="0.6"/>
  <rect x="22" y="43" width="25" height="2" rx="1" fill="white" opacity="0.6"/>
  
  <!-- Scale indicator (small arrow or dots) -->
  <circle cx="70" cy="37" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="74" cy="37" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="78" cy="37" r="1.5" fill="white" opacity="0.5"/>
</svg>